pipeline_branch: main
codex_may_publish: false # 自动上架已停用；上传一律负责人手动（负责人 2026-11-13 定）
channels: [workbuddy-skill] # 当前只跑 WorkBuddy 团队版技能包；跑通后可加 workbuddy-expert、skillhub
allow_listing_without_host_acceptance: false
sibling_reuse: false # 同设备账户复用
min_gross_margin: 0.6
max_rounds: 3 # 按尝试数计（LI 2026-11-16 定）；规格退回上限另计，为 1 次
max_parallel: 2
claim_timeout_hours: 6
rollback:
  max_failure_rate: 0.2
schedule:
  codex_spec: "每 2 小时"
  codex_dev: "每 2 小时"
  codex_test: "每 2 小时"
